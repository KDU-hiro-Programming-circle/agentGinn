<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sesami Dashboard</title>
  <link rel="stylesheet" href="/sesami/static/style.css">
</head>
<body>
  <header>
    <h1>Sesami Dashboard</h1>
    <span id="last-updated">-</span>
  </header>

  <!-- Populated by script.js: one stat/chart card per registered sensor,
       plus a fixed card for the host PC's system stats. Sensor count
       grows over time, so the layout is built dynamically rather than
       hardcoded here. -->
  <section class="stat-grid" id="stat-grid"></section>
  <section class="chart-grid" id="chart-grid"></section>

  <script src="/sesami/static/chart.min.js"></script>
  <script src="/sesami/static/script.js"></script>
</body>
</html>
